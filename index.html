<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sales Management - Brochure</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fotocamera a schermo intero come sfondo */
    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Pagina "in AR" sopra la fotocamera, cliccabile */
    #ar-link {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;           /* solo l'immagine è cliccabile */
    }

    #ar-page {
      max-width: 80vw;
      max-height: 80vh;
      width: auto;
      height: auto;
      pointer-events: auto;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform: perspective(900px) rotateX(6deg) scale(0.9);
      animation:
        appear 0.8s ease-out 0.2s forwards,
        float 4s ease-in-out 1s infinite;
    }

    @keyframes appear {
      to { opacity: 1; transform: perspective(900px) rotateX(0deg) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: perspective(900px) translateY(0) scale(1); }
      50%      { transform: perspective(900px) translateY(-10px) scale(1.01); }
    }
  </style>
</head>
<body>

  <video id="camera" autoplay playsinline muted></video>

  <a id="ar-link" href="https://online.fliphtml5.com/kyszr/Brochure-completa/">
    <img id="ar-page" src="./pag1.png" alt="Brochure Sales Management">
  </a>

  <script>
    // Avvia la fotocamera posteriore. Se non è disponibile, resta lo sfondo nero
    // e la pagina è comunque visibile e cliccabile.
    (function () {
      const video = document.getElementById('camera');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      }).then(function (stream) {
        video.srcObject = stream;
        video.play().catch(function () {});
      }).catch(function (err) {
        console.warn('Fotocamera non disponibile:', err);
      });
    })();
  </script>

</body>
</html>
